# Root argv, the command the launcher runs when it is uid 0.
# Image: archlinux:latest
# Install: pacman -S --noconfirm bubblewrap
# The script is check.sh: Compose word-splits a string command and interpolates $.
services:
  check:
    image: archlinux:latest
    entrypoint: ["sh", "/check.sh"]
    volumes:
      - ./check.sh:/check.sh:ro
