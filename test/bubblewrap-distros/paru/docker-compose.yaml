# The image only installs paru. The command under test is the launcher argv.
# Install: paru -S --noconfirm bubblewrap
# The script is check.sh: Compose word-splits a string command and interpolates $.
services:
  check:
    build: .
    entrypoint: ["sh", "/check.sh"]
    volumes:
      - ./check.sh:/check.sh:ro
