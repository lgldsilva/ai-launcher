name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COVERAGE_MIN: "90"

jobs:
  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Tests (race + shuffle)
        run: go test -race -shuffle=on ./...
      # The Makefile owns the coverage boundary. Duplicating the command here
      # let the two drift: CI and `make test-coverage` could report different
      # numbers on the same commit.
      - name: Coverage gate
        run: make test-coverage

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mutation gate
        run: make test-mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gremlins-mutation-report
          path: .mutation/gremlins.json
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  # Gate for the distribution surface: install.sh is what users curl-pipe and
  # .goreleaser.yaml is what ships the binaries, so both are checked on every
  # push instead of failing at install or tag time.
  dist:
    name: install.sh + goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # goreleaser v2.13.0 requires go >= 1.25.4; go.mod pins 1.25.0.
          go-version: "1.25.4"
          cache: true
      - name: ShellCheck + shfmt + goreleaser check
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          make lint-dist

  # SAST on our own code, next to govulncheck's scan of our dependencies. The
  # tree carries #nosec annotations that assert a finding was reviewed; without
  # the scanner in CI nothing ever checks that those assertions still hold.
  # The Makefile owns the pinned gosec version, same reason as the coverage job.
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # gosec v2.28.0 requires go >= 1.25.8; go.mod pins 1.25.0 and
          # setup-go sets GOTOOLCHAIN=local, so `go run` cannot fetch a newer
          # toolchain by itself. Same shape as the dist job's goreleaser pin.
          go-version: "1.25.8"
          cache: true
      - name: gosec
        run: make sec-static

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  # trivy-action tags < 0.35.0 were force-pushed to malware in March 2026
  # (CVE-2026-33634); this pins the v0.36.0 commit SHA, never a mutable tag.
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate and upload SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          upload-artifact: true
          artifact-name: ai-launcher-sbom

  # SonarCloud (sonarcloud.io) — cloud analysis that works from GitHub-hosted
  # runners. Needs the SONAR_TOKEN secret; organization/project key come from
  # repo variables with the defaults below. Every step skips cleanly until the
  # secret exists, so forks and early setup stay green.
  #
  # SONAR_TOKEN is bound at the job level ONLY because step `if:` conditions
  # cannot see `secrets` — every step skips cleanly except the scan, so only
  # the pinned SonarSource action ever consumes it (never the coverage/tests
  # steps). The action is pinned by SHA so a newly published release cannot
  # run with the secret.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'lgldsilva' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'lgldsilva_ai-launcher' }}
      # `secrets` is not available in step `if:` conditions, so the token is
      # bound at the job level and the steps gate on `env.SONAR_TOKEN` instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0 # full history for accurate new-code detection
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          go test -covermode=atomic \
            -coverpkg=github.com/lgldsilva/ai-launcher/internal/config,github.com/lgldsilva/ai-launcher/internal/catalog,github.com/lgldsilva/ai-launcher/internal/launcher,github.com/lgldsilva/ai-launcher/internal/container \
            -coverprofile=coverage.out ./internal/config ./internal/catalog ./internal/launcher ./internal/container
      # Official SonarSource action pinned by SHA (an npx install trips the
      # githubactions:S6505 supply-chain rule and fails the new-security gate).
      - name: SonarCloud analysis (waits for the quality gate)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
      - name: SonarCloud skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set — skipping SonarCloud analysis."
