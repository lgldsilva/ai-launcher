# SonarCloud (sonarcloud.io) — analysis runs in GitHub Actions (see the
# `sonar` job in .github/workflows/ci.yml). Host, organization, project key
# and token are passed as -D flags by CI; never hardcode them here.
# Local run:
#   go test -covermode=atomic \
#     -coverpkg=github.com/lgldsilva/ai-launcher/internal/config,github.com/lgldsilva/ai-launcher/internal/catalog,github.com/lgldsilva/ai-launcher/internal/launcher,github.com/lgldsilva/ai-launcher/internal/container \
#     -coverprofile=coverage.out ./internal/config ./internal/catalog ./internal/launcher ./internal/container
#   npx -y sonarqube-scanner -Dsonar.host.url=https://sonarcloud.io \
#     -Dsonar.token=$SONAR_TOKEN -Dsonar.organization=<org> \
#     -Dsonar.projectKey=<project-key>

sonar.sources=.
# testdata/scripts is a verbatim vendor corpus (curl|bash bootstrappers plus
# the ai-memory wrapper). It exists so ClassifyScript is proven against the
# real files, not paraphrases. Those scripts trip shell reliability/security
# rules that do not apply to first-party code; rewriting them would hide the
# classification contract. Exclude the tree from analysis, not from git.
sonar.exclusions=dist/**,bin/**,install.sh,**/vendor/**,.ai-launcher/**,internal/sourcehealth/testdata/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# Aligned with the Makefile 90% gate: the gate measures internal/config,
# internal/catalog, internal/launcher, and internal/container (excluding the
# PTY executor and platform-specific replace_*.go files). Everything else is
# excluded from the coverage metric, not from analysis.
# Mirrors the Makefile boundary: only internal/config, internal/catalog,
# internal/launcher and internal/container are measured, minus the PTY
# executor and the platform-specific replace_*.go files. Keep this list in
# sync with the COVERAGE_EXCLUDE regex in .ai-standards.env.
sonar.coverage.exclusions=cmd/**,internal/tui/**,internal/installer/**,internal/selfupdate/**,internal/cmd/**,test/**,internal/launcher/executor*.go,internal/launcher/replace_*.go
# Mutation score is enforced by the dedicated containerized Makefile target;
# Sonar remains responsible for source analysis and line coverage only.
