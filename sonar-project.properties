# SonarQube CE (homelab — GitHub-hosted runners cannot reach
# sonar.raspberrypi.lan, so analysis runs on the Gitea mirror's act_runner;
# see .gitea/workflows/ci.yml). Run through the vendored script:
#   SONAR_TOKEN=... PROJECT_KEY=ai-launcher EPHEMERAL=0 \
#     SONAR_HOST_URL=https://sonar.raspberrypi.lan \
#     COVERAGE_FILE=coverage.out USE_PROJECT_PROPERTIES=1 \
#     scripts/sonar/sonar-ephemeral.sh
# The server URL comes from the script's SONAR_HOST_URL (-Dsonar.host.url),
# never from a hardcoded sonar.host.url line here.
sonar.projectKey=ai-launcher
sonar.projectName=ai-launcher

sonar.sources=.
sonar.exclusions=dist/**,bin/**,scripts/sonar/**,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# Aligned with the Makefile 90% gate: the gate measures internal/config,
# internal/catalog, and internal/launcher (excluding the PTY executor and
# platform-specific replace_*.go files). Everything else is excluded from the
# coverage metric, not from analysis.
sonar.coverage.exclusions=cmd/**,internal/tui/**,internal/installer/**,test/**,internal/launcher/executor.go,internal/launcher/replace_*.go
